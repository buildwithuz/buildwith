# Local development dependencies only. Production lives in deploy/compose.prod.yml.
name: buildwith-dev

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: buildwith
      POSTGRES_PASSWORD: buildwith
      POSTGRES_DB: buildwith
    ports:
      - "${BUILDWITH_DB_PORT:-5433}:5432"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buildwith -d buildwith"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db:
