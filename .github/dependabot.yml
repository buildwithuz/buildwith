version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Asia/Tashkent }
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore(deps)" }
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /apps/api
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Asia/Tashkent }
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore(deps)" }
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    commit-message: { prefix: "ci(deps)" }
    groups:
      actions:
        patterns: ["*"]

  # Base images in the Dockerfiles...
  - package-ecosystem: docker
    directories: [/apps/api, /apps/web]
    schedule: { interval: monthly }
    commit-message: { prefix: "chore(deps)" }

  # ...and the images the production compose file runs (Postgres, Caddy).
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule: { interval: monthly }
    commit-message: { prefix: "chore(deps)" }
