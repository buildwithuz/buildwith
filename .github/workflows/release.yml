name: Release

# release-please reads Conventional Commit titles on main, keeps a "Release vX.Y.Z" PR open with the changelog,
# and creates the tag + GitHub Release when that PR is merged (after review, like any other PR).
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
