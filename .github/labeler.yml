"area:web":
  - changed-files:
      - any-glob-to-any-file: ["apps/web/**"]
"area:api":
  - changed-files:
      - any-glob-to-any-file: ["apps/api/**"]
"area:ui":
  - changed-files:
      - any-glob-to-any-file: ["packages/ui/**"]
"area:contract":
  - changed-files:
      - any-glob-to-any-file: ["packages/api-spec/**"]
"area:i18n":
  - changed-files:
      - any-glob-to-any-file: ["packages/i18n/**", "packages/translit/**", "apps/api/internal/translit/**"]
"area:db":
  - changed-files:
      - any-glob-to-any-file: ["apps/api/db/migrations/**"]
"area:infra":
  - changed-files:
      - any-glob-to-any-file: [".github/**", "deploy/**", ".devcontainer/**"]
"area:docs":
  - changed-files:
      - any-glob-to-any-file: ["docs/**", "*.md"]
