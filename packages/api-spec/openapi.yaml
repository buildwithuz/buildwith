  /mod/ban:
    post:
      operationId: banUser
      tags: [mod]
      summary: Ban or unban an account (moderators only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, banned, reason]
              properties:
                username: { type: string, maxLength: 30 }
                banned: { type: boolean }
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        "204": { description: Done, and written to the public log. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /mod/feature:
    post:
      operationId: featureArticle
      tags: [mod]
      summary: Feature or unfeature an article (moderators only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [article_id, featured]
              properties:
                article_id: { type: integer, format: int64 }
                featured: { type: boolean }
      responses:
        "204": { description: Done. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /mod/domain-rules:
    get:
      operationId: listDomainRules
      tags: [mod]
      summary: Per-domain ranking rules (moderators only)
      responses:
        "200":
          description: The rules.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/DomainRule" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: setDomainRule
      tags: [mod]
      summary: Set a domain's ranking multiplier, or ban it (moderators only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain: { type: string, maxLength: 253 }
                multiplier: { type: number, minimum: 0, maximum: 2, default: 1 }
                banned: { type: boolean, default: false }
                note: { type: string, maxLength: 500 }
      responses:
        "200":
          description: The rule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DomainRule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /mod/holds:
    get:
      operationId: listHolds
      tags: [mod]
      summary: Items held back for review (moderators only)
      parameters: [{ $ref: "#/components/parameters/Limit" }]
      responses:
        "200":
          description: The holds.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Hold" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: releaseHold
      tags: [mod]
      summary: Let a held item through (moderators only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject_type, subject_id]
              properties:
                subject_type: { $ref: "#/components/schemas/FlagSubject" }
                subject_id: { type: integer, format: int64 }
      responses:
        "204": { description: Released. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: bw_session
      description: |
        Set by the sign-in endpoints. Every mutation also needs the `X-CSRF-Token`
        header, whose value comes from `GET /auth/me`.

  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    Username:
      name: username
      in: path
      required: true
      schema: { type: string, maxLength: 30 }
    Slug:
      name: slug
      in: path
      required: true
      schema: { type: string, maxLength: 30 }
    Cursor:
      name: cursor
      in: query
      description: The `nextCursor` from the previous page. Opaque; do not construct one.
      schema: { type: string, maxLength: 120 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 30 }

  responses:
    BadRequest:
      description: The request could not be read.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: You need to be signed in.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Signed in, but not allowed to do this.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such thing, or it is not visible to you.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: That conflicts with something that already exists.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Invalid:
      description: The request was understood but a field is not acceptable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooMany:
      description: You are doing that too often.
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unavailable:
      description: A dependency is down.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotConfigured:
      description: This sign-in method is not configured on this server.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UserPage:
      description: A page of users.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/UserPage" }
    Relation:
      description: How you now relate to that user.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Relation" }
    VoteState:
      description: Your vote and the new total.
      content:
        application/json:
          schema:
            type: object
            required: [points, viewer_vote]
            properties:
              points: { type: integer }
              viewer_vote: { $ref: "#/components/schemas/VoteValue" }
    NoteState:
      description: The note's counters and your relationship to it.
      content:
        application/json:
          schema:
            type: object
            required: [like_count, repost_count, liked, reposted, bookmarked]
            properties:
              like_count: { type: integer }
              repost_count: { type: integer }
              liked: { type: boolean }
              reposted: { type: boolean }
              bookmarked: { type: boolean }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { $ref: "#/components/schemas/ErrorCode" }
        message:
          type: string
          description: A short sentence for logs. User-facing text comes from i18n, keyed by `code`.
        field:
          type: string
          description: Which request field is at fault, when one is.

    ErrorCode:
      type: string
      enum:
        - bad_request
        - unauthorized
        - forbidden
        - not_found
        - conflict
        - invalid
        - rate_limited
        - banned
        - blocked
        - duplicate_url
        - username_taken
        - slug_taken
        - edit_window_closed
        - karma_too_low
        - new_account_limit
        - reply_not_allowed
        - not_configured
        - too_large
        - unsupported_media
        - held_for_review
        - internal

    Health:
      type: object
      required: [status, version]
      properties:
        status: { type: string, enum: [ok, degraded] }
        version: { type: string }

    Lang:   { type: string, enum: [uz, ru, en] }
    Script: { type: string, enum: [latn, cyrl] }
    Theme:  { type: string, enum: [system, light, dark] }
    Accent: { type: string, enum: [lapis, turquoise, saffron, plum, moss] }
    OAuthProvider: { type: string, enum: [github, google] }
    MediaKind: { type: string, enum: [avatar, banner, note, article, cover] }
    LinkKind: { type: string, enum: [link, text, ask, show] }
    LinkSort: { type: string, enum: [top, new, best], default: top }
    ArticleSort: { type: string, enum: [latest, popular, featured], default: latest }
    ArticleStatus: { type: string, enum: [draft, scheduled, published] }
    CommentSubject: { type: string, enum: [link, article] }
    CommentSort: { type: string, enum: [best, new], default: best }
    VoteSubject: { type: string, enum: [link, article, comment] }
    FlagSubject: { type: string, enum: [link, article, comment, note] }
    ReportSubject: { type: string, enum: [link, article, comment, note, user] }
    ReportReason: { type: string, enum: [spam, abuse, off_topic, illegal, duplicate, other] }
    SearchKind: { type: string, enum: [link, article, note, comment, user] }
    ReplyPolicy: { type: string, enum: [everyone, following, mentioned] }
    BadgeKind: { type: string, enum: [github, company_email, moderator, early, author, founder] }
    FeedKind: { type: string, enum: [link, note, article] }

    SessionInfo:
      type: object
      required: [user, csrf_token, needs_username, dev_login_enabled]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
        csrf_token: { type: string }
        needs_username:
          type: boolean
          description: True right after a first sign-in, before a username is claimed.
        dev_login_enabled: { type: boolean }

    TelegramAuth:
      type: object
      description: The payload the Telegram login widget produces, verified against the bot token.
      required: [id, auth_date, hash]
      properties:
        id: { type: integer, format: int64 }
        first_name: { type: string }
        last_name: { type: string }
        username: { type: string }
        photo_url: { type: string }
        auth_date: { type: integer, format: int64 }
        hash: { type: string }

    User:
      type: object
      required: [id, username, display_name, karma, created_at, accent, is_moderator]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        display_name: { type: string }
        pronouns: { type: string }
        bio: { type: string }
        role_title: { type: string }
        company: { type: string }
        location: { type: string }
        open_to_work: { type: boolean }
        accent: { $ref: "#/components/schemas/Accent" }
        avatar_url: { type: [string, "null"] }
        banner_url: { type: [string, "null"] }
        karma: { type: integer }
        is_moderator: { type: boolean }
        lang: { $ref: "#/components/schemas/Lang" }
        script: { $ref: "#/components/schemas/Script" }
        theme: { $ref: "#/components/schemas/Theme" }
        badges: { type: array, items: { $ref: "#/components/schemas/Badge" } }
        created_at: { type: string, format: date-time }

    Badge:
      type: object
      required: [kind]
      properties:
        kind: { $ref: "#/components/schemas/BadgeKind" }
        detail: { type: string }

    ProfileEdit:
      type: object
      properties:
        display_name: { type: string, maxLength: 60 }
        pronouns: { type: string, maxLength: 24 }
        bio: { type: string, maxLength: 160 }
        role_title: { type: string, maxLength: 60 }
        company: { type: string, maxLength: 60 }
        location: { type: string, maxLength: 60 }
        open_to_work: { type: boolean }
        accent: { $ref: "#/components/schemas/Accent" }
        links:
          type: array
          maxItems: 8
          items: { $ref: "#/components/schemas/ProfileLink" }
        stack:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 30 }

    Profile:
      type: object
      required: [user, readme_html, links, stack, repos, counts]
      properties:
        user: { $ref: "#/components/schemas/User" }
        readme_html: { type: string }
        readme_md: { type: string, description: Only present for the profile's owner. }
        links:
          type: array
          items: { $ref: "#/components/schemas/ProfileLink" }
        stack: { type: array, items: { type: string } }
        repos: { type: array, items: { $ref: "#/components/schemas/Repo" } }
        counts:
          type: object
          required: [links, notes, articles, comments, followers, following]
          properties:
            links: { type: integer }
            notes: { type: integer }
            articles: { type: integer }
            comments: { type: integer }
            followers: { type: integer }
            following: { type: integer }
        relation:
          oneOf:
            - $ref: "#/components/schemas/Relation"
            - type: "null"

    Relation:
      type: object
      required: [following, followed_by, blocking, muting]
      properties:
        following: { type: boolean }
        followed_by: { type: boolean }
        blocking: { type: boolean }
        muting: { type: boolean }

    Repo:
      type: object
      required: [full_name, url]
      properties:
        full_name: { type: string }
        description: { type: string }
        language: { type: string }
        stars: { type: integer }
        url: { type: string }

    Media:
      type: object
      required: [id, url, width, height, mime]
      properties:
        id: { type: integer, format: int64 }
        url: { type: string }
        width: { type: integer }
        height: { type: integer }
        mime: { type: string }

    Tag:
      type: object
      required: [slug, name, post_count]
      properties:
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        post_count: { type: integer }
        following: { type: boolean }

    LinkNew:
      type: object
      required: [kind, title]
      properties:
        kind: { $ref: "#/components/schemas/LinkKind" }
        title: { type: string, minLength: 3, maxLength: 100 }
        url: { type: [string, "null"], maxLength: 2000 }
        body_md: { type: string, maxLength: 20000 }
        tags: { type: array, maxItems: 3, items: { type: string, maxLength: 30 } }

    Link:
      type: object
      required:
        [id, kind, title, slug, author, points, comment_count, created_at, path, tags, viewer_vote]
      properties:
        id: { type: integer, format: int64 }
        kind: { $ref: "#/components/schemas/LinkKind" }
        title: { type: string }
        slug: { type: string }
        path: { type: string, description: The canonical path on the site, e.g. /l/42/my-post. }
        url: { type: [string, "null"] }
        domain: { type: string }
        body_md: { type: string }
        body_html: { type: string }
        author: { $ref: "#/components/schemas/User" }
        tags: { type: array, items: { $ref: "#/components/schemas/Tag" } }
        points: { type: integer }
        comment_count: { type: integer }
        viewer_vote: { $ref: "#/components/schemas/VoteValue" }
        viewer_flagged: { type: boolean }
        can_edit: { type: boolean }
        killed: { type: boolean }
        created_at: { type: string, format: date-time }
        edited_at: { type: [string, "null"], format: date-time }

    LinkPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Link" } }
        nextCursor: { type: [string, "null"] }

    Comment:
      type: object
      required: [id, author, body_html, points, depth, created_at, viewer_vote, subject_type, subject_id]
      properties:
        id: { type: integer, format: int64 }
        subject_type: { $ref: "#/components/schemas/CommentSubject" }
        subject_id: { type: integer, format: int64 }
        parent_id: { type: [integer, "null"], format: int64 }
        depth: { type: integer }
        author: { $ref: "#/components/schemas/User" }
        body_md: { type: string }
        body_html: { type: string }
        points: { type: integer }
        viewer_vote: { $ref: "#/components/schemas/VoteValue" }
        can_edit: { type: boolean }
        collapsed:
          type: boolean
          description: True when a mute or a muted word applies; render it folded, not removed.
        deleted: { type: boolean }
        killed: { type: boolean }
        created_at: { type: string, format: date-time }
        edited_at: { type: [string, "null"], format: date-time }

    NoteNew:
      type: object
      properties:
        body_md: { type: string, maxLength: 2000 }
        reply_to_id: { type: [integer, "null"], format: int64 }
        quote_of_id: { type: [integer, "null"], format: int64 }
        repost_of_id: { type: [integer, "null"], format: int64 }
        reply_policy: { $ref: "#/components/schemas/ReplyPolicy" }
        code: { $ref: "#/components/schemas/CodeBlockNew" }
        media:
          type: array
          maxItems: 4
          description: Up to four images. Alt text is required for every one.
          items: { $ref: "#/components/schemas/NoteMediaNew" }

    Note:
      type: object
      required:
        [id, author, body_html, like_count, repost_count, reply_count, created_at, path, media]
      properties:
        id: { type: integer, format: int64 }
        author: { $ref: "#/components/schemas/User" }
        path: { type: string, description: The canonical path, e.g. /@aziz/n/42. }
        body_md: { type: string }
        body_html: { type: string }
        code:
          oneOf:
            - $ref: "#/components/schemas/CodeBlock"
            - type: "null"
        media:
          type: array
          items: { $ref: "#/components/schemas/NoteMedia" }
        preview:
          oneOf:
            - $ref: "#/components/schemas/LinkPreview"
            - type: "null"
        reply_to_id: { type: [integer, "null"], format: int64 }
        quote_of:
          oneOf:
            - $ref: "#/components/schemas/Note"
            - type: "null"
        repost_of:
          oneOf:
            - $ref: "#/components/schemas/Note"
            - type: "null"
        reply_policy: { $ref: "#/components/schemas/ReplyPolicy" }
        like_count: { type: integer }
        repost_count: { type: integer }
        quote_count: { type: integer }
        reply_count: { type: integer }
        liked: { type: boolean }
        reposted: { type: boolean }
        bookmarked: { type: boolean }
        can_edit: { type: boolean }
        can_reply: { type: boolean }
        killed: { type: boolean }
        promoted_link_id: { type: [integer, "null"], format: int64 }
        created_at: { type: string, format: date-time }
        edited_at: { type: [string, "null"], format: date-time }

    LinkPreview:
      type: object
      required: [url, domain]
      properties:
        url: { type: string }
        title: { type: string }
        description: { type: string }
        domain: { type: string }
        image:
          oneOf:
            - $ref: "#/components/schemas/Media"
            - type: "null"

    NotePage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Note" } }
        nextCursor: { type: [string, "null"] }

    ArticleEdit:
      type: object
      required: [title, body_md]
      properties:
        title: { type: string, maxLength: 140 }
        subtitle: { type: string, maxLength: 200 }
        body_md: { type: string, maxLength: 200000 }
        lang: { $ref: "#/components/schemas/Lang" }
        canonical_url: { type: [string, "null"], maxLength: 2000 }
        cover_media_id: { type: [integer, "null"], format: int64 }
        series_id: { type: [integer, "null"], format: int64 }
        series_sort: { type: integer, minimum: 0, maximum: 999 }
        slug: { type: string, maxLength: 120 }
        tags: { type: array, maxItems: 5, items: { type: string, maxLength: 30 } }

    Article:
      type: object
      required:
        [id, title, slug, author, status, points, comment_count, reading_minutes, path, tags, created_at]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        subtitle: { type: string }
        slug: { type: string }
        path: { type: string, description: The canonical path, e.g. /@aziz/why-go. }
        author: { $ref: "#/components/schemas/User" }
        body_md: { type: string }
        body_html: { type: string }
        toc: { type: array, items: { $ref: "#/components/schemas/TocEntry" } }
        cover:
          oneOf:
            - $ref: "#/components/schemas/Media"
            - type: "null"
        lang: { $ref: "#/components/schemas/Lang" }
        canonical_url: { type: [string, "null"] }
        series:
          oneOf:
            - $ref: "#/components/schemas/Series"
            - type: "null"
        series_sort: { type: integer }
        status: { $ref: "#/components/schemas/ArticleStatus" }
        tags: { type: array, items: { $ref: "#/components/schemas/Tag" } }
        points: { type: integer }
        comment_count: { type: integer }
        reading_minutes: { type: integer }
        viewer_vote: { $ref: "#/components/schemas/VoteValue" }
        featured: { type: boolean }
        can_edit: { type: boolean }
        killed: { type: boolean }
        published_at: { type: [string, "null"], format: date-time }
        scheduled_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TocEntry:
      type: object
      required: [level, text, id]
      properties:
        level: { type: integer, minimum: 2, maximum: 4 }
        text: { type: string }
        id: { type: string }

    ArticlePage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Article" } }
        nextCursor: { type: [string, "null"] }

    ArticleVersion:
      type: object
      required: [n, title, created_at]
      properties:
        n: { type: integer }
        title: { type: string }
        created_at: { type: string, format: date-time }

    Series:
      type: object
      required: [id, slug, title]
      properties:
        id: { type: integer, format: int64 }
        slug: { type: string }
        title: { type: string }
        description: { type: string }

    FeedItem:
      type: object
      required: [kind, created_at]
      properties:
        kind: { $ref: "#/components/schemas/FeedKind" }
        created_at: { type: string, format: date-time }
        link:
          oneOf:
            - $ref: "#/components/schemas/Link"
            - type: "null"
        note:
          oneOf:
            - $ref: "#/components/schemas/Note"
            - type: "null"
        article:
          oneOf:
            - $ref: "#/components/schemas/Article"
            - type: "null"

    FeedPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/FeedItem" } }
        nextCursor: { type: [string, "null"] }

    UserPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/User" } }
        nextCursor: { type: [string, "null"] }

    Notification:
      type: object
      required: [id, kind, read, created_at]
      properties:
        id: { type: integer, format: int64 }
        kind:
          type: string
          enum: [reply, mention, like, repost, quote, follow, comment,
                 article_published, mod_action, badge, featured]
        actor:
          oneOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
        subject_type: { type: string }
        subject_id: { type: [integer, "null"], format: int64 }
        href: { type: string, description: Where to go when the notification is clicked. }
        read: { type: boolean }
        created_at: { type: string, format: date-time }

    NotificationPage:
      type: object
      required: [items, nextCursor, unread]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Notification" } }
        nextCursor: { type: [string, "null"] }
        unread: { type: integer }

    SearchResults:
      type: object
      required: [links, notes, articles, comments, users, total]
      properties:
        total: { type: integer }
        links: { type: array, items: { $ref: "#/components/schemas/Link" } }
        notes: { type: array, items: { $ref: "#/components/schemas/Note" } }
        articles: { type: array, items: { $ref: "#/components/schemas/Article" } }
        comments: { type: array, items: { $ref: "#/components/schemas/Comment" } }
        users: { type: array, items: { $ref: "#/components/schemas/User" } }

    Report:
      type: object
      required: [id, reporter, subject_type, subject_id, reason, created_at]
      properties:
        id: { type: integer, format: int64 }
        reporter: { $ref: "#/components/schemas/User" }
        subject_type: { $ref: "#/components/schemas/ReportSubject" }
        subject_id: { type: integer, format: int64 }
        reason: { $ref: "#/components/schemas/ReportReason" }
        note: { type: string }
        created_at: { type: string, format: date-time }

    ModAction:
      type: object
      required: [id, actor, action, subject_type, created_at]
      properties:
        id: { type: integer, format: int64 }
        actor: { $ref: "#/components/schemas/User" }
        action: { type: string }
        subject_type: { type: string }
        subject_id: { type: [integer, "null"], format: int64 }
        subject_text: { type: string }
        reason: { type: string }
        created_at: { type: string, format: date-time }

    ModLogPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ModAction" } }
        nextCursor: { type: [string, "null"] }

    DomainRule:
      type: object
      required: [domain, multiplier, banned]
      properties:
        domain: { type: string }
        multiplier: { type: number }
        banned: { type: boolean }
        note: { type: string }

    Hold:
      type: object
      required: [subject_type, subject_id, reason, created_at]
      properties:
        subject_type: { type: string }
        subject_id: { type: integer, format: int64 }
        reason: { type: string }
        created_at: { type: string, format: date-time }

    VoteValue: { type: integer, enum: [-1, 0, 1] }
    VoteDirection: { type: integer, enum: [-1, 1] }

    CodeBlock:
      type: object
      required: [lang, body, html]
      properties:
        lang: { type: string }
        body: { type: string }
        html: { type: string, description: Highlighted on the server; safe to render. }

    CodeBlockNew:
      type: object
      description: One optional code block, highlighted on the server.
      required: [body]
      properties:
        lang: { type: string, maxLength: 20 }
        body: { type: string, maxLength: 4000 }

    NoteMedia:
      type: object
      required: [alt, media]
      properties:
        alt: { type: string }
        media: { $ref: "#/components/schemas/Media" }

    NoteMediaNew:
      type: object
      required: [media_id, alt]
      properties:
        media_id: { type: integer, format: int64 }
        alt: { type: string, minLength: 1, maxLength: 300 }

    ProfileLink:
      type: object
      required: [kind, url]
      properties:
        kind: { type: string, enum: [website, github, gitlab, telegram, x, linkedin, email, other] }
        url: { type: string, maxLength: 300 }

    HeatmapDay:
      type: object
      required: [day, count]
      properties:
        day: { type: string, format: date }
        count: { type: integer }
