openapi: 3.1.0

info:
  title: buildwith.uz API
  version: 0.1.0
  description: |
    The single source of truth for the buildwith.uz HTTP API. Go server interfaces and
    the TypeScript client are both generated from this file by `pnpm gen`; CI fails if
    the generated code is stale.

    Conventions
      * Lists are keyset paginated: `?cursor=&limit=` returns `{ items, nextCursor }`.
        A `nextCursor` of `null` means the end. Never offset pagination.
      * Mutations need the session cookie **and** the `X-CSRF-Token` header.
      * Errors are always `Error { code, message, field? }` with a code from one enum.
      * Times are RFC 3339 in UTC.
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later

servers:
  - url: /v1

tags:
  - { name: health }
  - { name: auth }
  - { name: users }
  - { name: social }
  - { name: media }
  - { name: tags }
  - { name: links }
  - { name: comments }
  - { name: votes }
  - { name: notes }
  - { name: articles }
  - { name: timeline }
  - { name: notify }
  - { name: search }
  - { name: mod }

security:
  - session: []

paths:
  /health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Liveness and readiness
      security: []
      responses:
        "200":
          description: The service and its database are reachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          $ref: "#/components/responses/Unavailable"

  /auth/me:
    get:
      operationId: getSession
      tags: [auth]
      summary: The signed-in user and a fresh CSRF token
      security: []
      responses:
        "200":
          description: Session state. `user` is null when nobody is signed in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }

  /auth/dev-login:
    post:
      operationId: devLogin
      tags: [auth]
      summary: Sign in as a seeded user (development builds only)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: { type: string, maxLength: 30 }
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /auth/{provider}/start:
    get:
      operationId: startOAuth
      tags: [auth]
      summary: Begin an OAuth sign-in
      security: []
      parameters:
        - { name: provider, in: path, required: true, schema: { $ref: "#/components/schemas/OAuthProvider" } }
        - { name: redirect_to, in: query, schema: { type: string, maxLength: 300 } }
      responses:
        "303":
          description: Redirect to the provider.
          headers:
            Location: { schema: { type: string } }
        "501":
          $ref: "#/components/responses/NotConfigured"

  /auth/{provider}/callback:
    get:
      operationId: finishOAuth
      tags: [auth]
      summary: Finish an OAuth sign-in
      security: []
      parameters:
        - { name: provider, in: path, required: true, schema: { $ref: "#/components/schemas/OAuthProvider" } }
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        "303":
          description: Signed in; redirect into the app (or to username selection).
          headers:
            Location: { schema: { type: string } }
            Set-Cookie: { schema: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /auth/telegram:
    post:
      operationId: telegramLogin
      tags: [auth]
      summary: Sign in with the Telegram login widget
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TelegramAuth" }
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "501": { $ref: "#/components/responses/NotConfigured" }

  /auth/username:
    post:
      operationId: chooseUsername
      tags: [auth]
      summary: Claim a username right after the first sign-in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username:
                  type: string
                  pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{1,29}$"
      responses:
        "200":
          description: Username claimed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out
      responses:
        "204": { description: Signed out. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /users/{username}:
    get:
      operationId: getProfile
      tags: [users]
      summary: A full profile page
      security: []
      parameters:
        - $ref: "#/components/parameters/Username"
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/me:
    patch:
      operationId: updateMe
      tags: [users]
      summary: Edit your own profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileEdit" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      operationId: deleteMe
      tags: [users]
      summary: Delete your account
      description: |
        Removes every piece of personal data and anonymizes authorship so existing
        threads keep their shape. Irreversible.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /users/me/preferences:
    patch:
      operationId: updatePreferences
      tags: [users]
      summary: Language, script and theme
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lang: { $ref: "#/components/schemas/Lang" }
                script: { $ref: "#/components/schemas/Script" }
                theme: { $ref: "#/components/schemas/Theme" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /users/me/readme:
    put:
      operationId: updateReadme
      tags: [users]
      summary: Replace your profile README
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body_md]
              properties:
                body_md: { type: string, maxLength: 20000 }
      responses:
        "200":
          description: Updated; returns the rendered HTML.
          content:
            application/json:
              schema:
                type: object
                required: [body_html]
                properties:
                  body_html: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /users/me/avatar:
    put:
      operationId: setAvatar
      tags: [users]
      summary: Set or clear your avatar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                media_id: { type: [integer, "null"], format: int64 }
      responses:
        "204": { description: Updated. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /users/me/banner:
    put:
      operationId: setBanner
      tags: [users]
      summary: Set or clear your profile banner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                media_id: { type: [integer, "null"], format: int64 }
      responses:
        "204": { description: Updated. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /users/me/repos/refresh:
    post:
      operationId: refreshRepos
      tags: [users]
      summary: Re-fetch your pinned GitHub repositories
      responses:
        "200":
          description: The refreshed list.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Repo" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          $ref: "#/components/responses/Conflict"

  /users/me/export:
    get:
      operationId: exportMe
      tags: [users]
      summary: Download everything you have written
      description: A zip of JSON plus Markdown, built on the fly.
      responses:
        "200":
          description: The archive.
          content:
            application/zip:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /users/{username}/heatmap:
    get:
      operationId: getHeatmap
      tags: [users]
      summary: Twelve months of daily activity counts
      security: []
      parameters:
        - $ref: "#/components/parameters/Username"
      responses:
        "200":
          description: One entry per active day.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/HeatmapDay" }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{username}/comments:
    get:
      operationId: listUserComments
      tags: [comments]
      summary: Comments and answers a user wrote, newest first
      security: []
      parameters:
        - $ref: "#/components/parameters/Username"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of comments.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Comment" } }
                  nextCursor: { type: [string, "null"] }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{username}/followers:
    get:
      operationId: listFollowers
      tags: [social]
      summary: Who follows this user
      security: []
      parameters:
        - $ref: "#/components/parameters/Username"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { $ref: "#/components/responses/UserPage" }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{username}/following:
    get:
      operationId: listFollowing
      tags: [social]
      summary: Who this user follows
      security: []
      parameters:
        - $ref: "#/components/parameters/Username"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { $ref: "#/components/responses/UserPage" }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{username}/follow:
    post:
      operationId: followUser
      tags: [social]
      summary: Follow a user
      parameters: [{ $ref: "#/components/parameters/Username" }]
      responses:
        "200": { $ref: "#/components/responses/Relation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: unfollowUser
      tags: [social]
      summary: Unfollow a user
      parameters: [{ $ref: "#/components/parameters/Username" }]
      responses:
        "200": { $ref: "#/components/responses/Relation" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /users/{username}/block:
    post:
      operationId: blockUser
      tags: [social]
      summary: Block a user
      description: Blocking is mutual invisibility and forbids interaction in both directions.
      parameters: [{ $ref: "#/components/parameters/Username" }]
      responses:
        "200": { $ref: "#/components/responses/Relation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      operationId: unblockUser
      tags: [social]
      summary: Unblock a user
      parameters: [{ $ref: "#/components/parameters/Username" }]
      responses:
        "200": { $ref: "#/components/responses/Relation" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /users/{username}/mute:
    post:
      operationId: muteUser
      tags: [social]
      summary: Mute a user
      description: Muting hides their content from you only; they are not told.
      parameters: [{ $ref: "#/components/parameters/Username" }]
      responses:
        "200": { $ref: "#/components/responses/Relation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      operationId: unmuteUser
      tags: [social]
      summary: Unmute a user
      parameters: [{ $ref: "#/components/parameters/Username" }]
      responses:
        "200": { $ref: "#/components/responses/Relation" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/muted-words:
    get:
      operationId: listMutedWords
      tags: [social]
      summary: Your muted words
      responses:
        "200":
          description: The list.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, word]
                      properties:
                        id: { type: integer, format: int64 }
                        word: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: addMutedWord
      tags: [social]
      summary: Mute a word
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [word]
              properties:
                word: { type: string, minLength: 2, maxLength: 40 }
      responses:
        "204": { description: Muted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Invalid" }

  /me/muted-words/{id}:
    delete:
      operationId: removeMutedWord
      tags: [social]
      summary: Unmute a word
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "204": { description: Unmuted. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /who-to-follow:
    get:
      operationId: whoToFollow
      tags: [social]
      summary: People followed by the people you follow
      parameters: [{ $ref: "#/components/parameters/Limit" }]
      responses:
        "200":
          description: Suggestions, most mutual follows first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [user, mutuals]
                      properties:
                        user: { $ref: "#/components/schemas/User" }
                        mutuals: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /open-to-work:
    get:
      operationId: listOpenToWork
      tags: [users]
      summary: Engineers who marked themselves open to work
      security: []
      parameters: [{ $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { $ref: "#/components/responses/UserPage" }

  /media:
    post:
      operationId: uploadMedia
      tags: [media]
      summary: Upload an image
      description: |
        Every upload is decoded, stripped of metadata and re-encoded before it is
        stored, so a malicious file never reaches a reader.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [kind, file]
              properties:
                kind: { $ref: "#/components/schemas/MediaKind" }
                file: { type: string, format: binary }
      responses:
        "201":
          description: Stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Media" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413":
          description: The file is larger than the limit for its kind.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/TooMany" }

  /tags:
    get:
      operationId: listTags
      tags: [tags]
      summary: Most used tags, or tags matching a query
      security: []
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 30 } }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Tags.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Tag" } }

  /tags/{slug}:
    get:
      operationId: getTag
      tags: [tags]
      summary: One tag, with whether you follow it
      security: []
      parameters: [{ $ref: "#/components/parameters/Slug" }]
      responses:
        "200":
          description: The tag.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tag" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tags/{slug}/follow:
    post:
      operationId: followTag
      tags: [tags]
      summary: Follow a tag
      parameters: [{ $ref: "#/components/parameters/Slug" }]
      responses:
        "200":
          description: Following.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tag" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: unfollowTag
      tags: [tags]
      summary: Unfollow a tag
      parameters: [{ $ref: "#/components/parameters/Slug" }]
      responses:
        "200":
          description: Not following.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tag" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /links:
    get:
      operationId: listLinks
      tags: [links]
      summary: The ranked lists — Top, New, Best, Savol, Koʻrsat, by tag, by domain
      security: []
      parameters:
        - { name: sort, in: query, schema: { $ref: "#/components/schemas/LinkSort" } }
        - { name: kind, in: query, schema: { $ref: "#/components/schemas/LinkKind" } }
        - { name: tag, in: query, schema: { type: string, maxLength: 30 } }
        - { name: domain, in: query, schema: { type: string, maxLength: 253 } }
        - { name: author, in: query, schema: { type: string, maxLength: 30 } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of link posts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinkPage" }
    post:
      operationId: createLink
      tags: [links]
      summary: Submit a link, text post, Savol or Koʻrsat
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LinkNew" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Link" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: The same URL was submitted recently; the existing post is returned.
          content:
            application/json:
              schema:
                type: object
                required: [error, existing]
                properties:
                  error: { $ref: "#/components/schemas/Error" }
                  existing: { $ref: "#/components/schemas/Link" }
        "422": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/TooMany" }

  /links/{id}:
    get:
      operationId: getLink
      tags: [links]
      summary: One link post
      security: []
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: The post.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Link" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateLink
      tags: [links]
      summary: Edit your own post (within the edit window)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, minLength: 3, maxLength: 100 }
                body_md: { type: string, maxLength: 20000 }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Link" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteLink
      tags: [links]
      summary: Delete your own post
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /links/{id}/promote-note:
    post:
      operationId: promoteNote
      tags: [links]
      summary: Turn one of your notes into a link post
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, minLength: 3, maxLength: 100 }
                tags: { type: array, maxItems: 3, items: { type: string, maxLength: 30 } }
      responses:
        "201":
          description: The new link post.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Link" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /comments:
    get:
      operationId: listComments
      tags: [comments]
      summary: The whole comment thread for one link or article
      security: []
      parameters:
        - { name: subject_type, in: query, required: true, schema: { $ref: "#/components/schemas/CommentSubject" } }
        - { name: subject_id, in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: sort, in: query, schema: { $ref: "#/components/schemas/CommentSort" } }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: |
            Comments in thread order; nest them by `depth`. With `best` (the default),
            siblings are ordered by points so the most useful answer comes first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Comment" } }
    post:
      operationId: createComment
      tags: [comments]
      summary: Comment, or reply to a comment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject_type, subject_id, body_md]
              properties:
                subject_type: { $ref: "#/components/schemas/CommentSubject" }
                subject_id: { type: integer, format: int64 }
                parent_id: { type: [integer, "null"], format: int64 }
                body_md: { type: string, minLength: 1, maxLength: 10000 }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/TooMany" }

