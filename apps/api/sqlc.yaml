version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries
    strict_function_checks: true
    gen:
      go:
        package: dbgen
        out: internal/dbgen
        sql_package: pgx/v5
        output_files_suffix: .gen
        emit_prepared_queries: false
        emit_interface: true
        emit_json_tags: false
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        emit_result_struct_pointers: false
        emit_params_struct_pointers: false
        query_parameter_limit: 1
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
          - column: "links.search"
            go_type: "string"
          - column: "notes.search"
            go_type: "string"
          - column: "articles.search"
            go_type: "string"
          - column: "comments.search"
            go_type: "string"
